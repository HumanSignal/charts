{{- /*
Credentials for the olap-db (ClickHouse) sub-chart. The sub-chart runs with
auth.createSecret=false and reads them from this secret, so the password can be
generated once and preserved across upgrades. Skipped when auth.secretName points
to an existing secret (keys: username, password).
*/}}
{{- if and (index .Values "olap-db").enabled (not (index .Values "olap-db").clickhouse.auth.secretName) }}
{{- $secretName := include "ls-olap-db.secretName" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": "keep"
  labels:
    {{- include "ls-secrets.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $secretObj := (lookup "v1" "Secret" .Release.Namespace $secretName) | default dict }}
  {{- $secretData := (get $secretObj "data") | default dict }}
  {{- /* use the configured password, otherwise keep the existing one or generate a random one */}}
  {{- $password := "" }}
  {{- if (index .Values "olap-db").clickhouse.auth.password }}
  {{- $password = (index .Values "olap-db").clickhouse.auth.password | toString | b64enc }}
  {{- else }}
  {{- $password = (get $secretData "password") | default (randAlphaNum 32 | b64enc) }}
  {{- end }}
  username: {{ (index .Values "olap-db").clickhouse.auth.username | toString | b64enc | quote }}
  password: {{ $password | quote }}
{{- end }}
