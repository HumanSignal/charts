apiVersion: v2
name: label-studio
description: Label Studio is a data labeling tool
home: https://labelstud.io/
type: application
icon: https://raw.githubusercontent.com/heartexlabs/label-studio/master/images/logo.png
# Chart version
version: 2.0.13
# Label Studio release version
appVersion: "1.23.2"
kubeVersion: ">= 1.14.0-0"
dependencies:
  - name: redis
    version: "21.2.14"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: redis.enabled
  - name: postgresql
    version: "16.7.27"
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: clickhouse
    alias: olap-db
    version: "0.5.6"
    repository: https://korax-dev.github.io/clickhouse-k8s
    condition: olap-db.enabled
